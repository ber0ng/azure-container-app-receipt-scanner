name: Lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    name: terraform (fmt + tflint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"

      - name: Format check
        run: terraform fmt -check -recursive infra

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: tflint
        working-directory: infra
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$(pwd)/.tflint.hcl"
          tflint --recursive --config "$(pwd)/.tflint.hcl" --format compact

  dockerfiles:
    name: dockerfile (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@v7

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: app/${{ matrix.service }}/Dockerfile
          failure-threshold: warning
