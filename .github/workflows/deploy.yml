name: deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "infra/app/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/_deploy-env.yml"

  # builds + deploys to dev only. staging/prod go through promote.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: build & push images
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build images
        run: |
          for svc in api worker; do
              docker build -t "${{ vars.ACR_LOGIN_SERVER }}/receipt-${svc}:${{ steps.tag.outputs.tag }}" "app/${svc}"
          done

      # don't push anything with fixable critical/high vulns
      - name: Trivy scan (api)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ vars.ACR_LOGIN_SERVER }}/receipt-api:${{ steps.tag.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy scan (worker)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ vars.ACR_LOGIN_SERVER }}/receipt-worker:${{ steps.tag.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Push to ACR
        run: |
          for svc in api worker; do
              docker push "${{ vars.ACR_LOGIN_SERVER }}/receipt-${svc}:${{ steps.tag.outputs.tag }}"
          done

  dev:
    needs: build
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: dev
      image_tag: ${{ needs.build.outputs.image_tag }}
