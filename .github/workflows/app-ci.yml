name: app-ci

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker]
    defaults:
      run:
        working-directory: app/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/${{ matrix.service }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Docker build
        run: docker build -t receipt-${{ matrix.service }}:ci .
